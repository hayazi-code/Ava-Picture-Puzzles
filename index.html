:root{font-family:Estedad,Tahoma,Arial,sans-serif;color:#174c59;background:#eaf8f4}*{box-sizing:border-box}html,body{margin:0;min-height:100%;overscroll-behavior:none}body{height:100dvh;display:flex;flex-direction:column;overflow:hidden}button,label{font:inherit;-webkit-tap-highlight-color:transparent}button{border:0;cursor:pointer}header{padding:calc(9px + env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 9px max(14px,env(safe-area-inset-left));display:flex;align-items:center;gap:10px;justify-content:space-between;background:#fffef9;border-bottom:1px solid #eee2d2;flex-shrink:0}.brand{display:flex;align-items:center;gap:9px;min-width:0}.logo{font-size:29px}.brand strong{font-size:clamp(17px,4vw,24px);color:#087f91;white-space:nowrap}.controls{display:flex;gap:7px;align-items:center}.btn,.upload{border-radius:16px;background:#e0f3ee;color:#174c59;padding:10px 13px;font-weight:800;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:44px}.upload{background:#69d4c3}.btn:active,.upload:active{transform:scale(.97)}#photo{display:none}.iconbtn{font-size:22px;padding:7px 11px;min-width:44px}.settings{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;padding:8px 12px;background:#fffef9;flex-shrink:0;border-bottom:1px solid #f1e7db}.group{display:flex;align-items:center;gap:4px;background:#e3f4ee;border-radius:17px;padding:4px}.group button{min-width:42px;min-height:38px;background:transparent;border-radius:13px;font-weight:800;color:#6b6c72}.group button.active{background:#fff;color:#087f91;box-shadow:0 2px 6px #0001}.toggle{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}.toggle input{accent-color:#087f91;width:21px;height:21px}.progress{font-size:13px;font-weight:800;color:#7d7d7d;min-width:45px;text-align:center}.workspace{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 10px calc(9px + env(safe-area-inset-bottom));gap:5px}.instruction{font-size:clamp(12px,2.6vw,15px);font-weight:700;color:#7b7980;min-height:24px;text-align:center}.canvas-wrap{width:100%;max-width:1100px;flex:1;min-height:0;position:relative;border-radius:25px;background:#fffef9;box-shadow:0 5px 24px #8b7c6620;overflow:hidden;touch-action:none}canvas{width:100%;height:100%;display:block;touch-action:none}.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:20px;pointer-events:none}.empty .emoji{font-size:clamp(50px,10vw,85px)}.empty strong{font-size:clamp(18px,4vw,26px)}.empty small{color:#8d8c8b}.empty.hidden{display:none}.overlay{position:fixed;inset:0;background:#293c4c77;z-index:20;display:none;align-items:center;justify-content:center;padding:18px}.overlay.show{display:flex}.modal{width:min(360px,100%);background:#fffef9;border-radius:30px;text-align:center;padding:25px;box-shadow:0 15px 50px #0003}.modal h2{color:#087f91}.modal .emoji{font-size:66px}.modal button{margin:5px}.confetti{position:fixed;z-index:30;pointer-events:none;animation:fall 2.3s linear forwards;font-size:24px}@keyframes fall{from{transform:translateY(-12vh) rotate(0)}to{transform:translateY(110vh) rotate(540deg);opacity:0}}@media(max-width:650px){header{gap:5px}.brand strong{font-size:18px}.btn .word{display:none}.btn,.upload{padding:8px 10px}.settings{gap:7px;padding:6px 7px}.toggle{font-size:12px}.group button{min-width:36px;min-height:35px}.workspace{padding:6px 6px calc(7px + env(safe-area-inset-bottom))}.canvas-wrap{border-radius:17px}}@media(max-height:580px){header{padding-top:4px;padding-bottom:4px}.settings{padding:3px}.instruction{display:none}}
body.immersive header,body.immersive .settings,body.immersive .instruction{display:none}body.immersive .workspace{padding:calc(env(safe-area-inset-top) + 12px) 8px calc(env(safe-area-inset-bottom) + 12px);gap:0}body.immersive .canvas-wrap{border-radius:0;max-width:none;box-shadow:none}#exitImmersive{display:none;position:fixed;top:calc(12px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));z-index:12;border-radius:15px;background:#fffef9e8;box-shadow:0 2px 12px #0002;color:#174c59;padding:9px 13px;font-weight:800;font-size:17px;min-width:44px;min-height:44px}body.immersive #exitImmersive{display:block}</style></head><body><header><div class="brand"><span class="logo">🧩</span><strong>پازل آوا</strong></div><div class="controls"><label for="photo" class="upload">📷 <span class="word">عکس تازه</span></label><input id="photo" type="file" accept="image/*"><button class="btn iconbtn" id="restart" aria-label="از نو چیدن" title="از نو چیدن">🔀</button><button class="btn iconbtn" id="fullscreen" aria-label="تمام‌صفحه" title="تمام‌صفحه">⛶</button></div></header><div class="settings"><div class="group" id="levels" aria-label="شمار تکه‌ها"><button class="active" data-n="6">۶</button><button data-n="12">۱۲</button><button data-n="24">۲۴</button><button data-n="32">۳۲</button></div><label class="toggle"><input type="checkbox" id="hint" checked> جای تکه</label><label class="toggle"><input type="checkbox" id="guide" checked> راهنما</label><span class="progress" id="progress">۰ از ۶</span></div><main class="workspace"><div class="instruction" id="message" aria-live="polite">یک عکس انتخاب کن 🌸</div><div class="canvas-wrap" id="wrap"><canvas id="game" aria-label="صفحهٔ پازل"></canvas><div class="empty" id="empty"><span class="emoji">🌷🧸</span><strong>بیا پازل بسازیم!</strong><small>روی «عکس تازه» بزن</small></div></div></main><button id="exitImmersive" aria-label="بازگشت به تنظیمات">✕</button><div class="overlay" id="win"><div class="modal"><div class="emoji">🎉🌟🌸</div><h2>آفرین آوا!</h2><p>پازل رو کامل کردی!</p><button class="upload" id="again">دوباره بازی کنیم 🧩</button><button class="btn" id="close">دیدن عکس</button></div></div>
<script>(()=>{'use strict';const $=s=>document.getElementById(s),canvas=$('game'),ctx=canvas.getContext('2d'),wrap=$('wrap');let photo=null,n=6,cols=3,rows=2,pieces=[],board={},active=null,selected=null,dpr=1,raf=0;const dims={6:[3,2],12:[4,3],24:[6,4],32:[8,4]},digits='۰۱۲۳۴۵۶۷۸۹',fa=x=>String(x).replace(/\d/g,d=>digits[d]);const message=t=>$('message').textContent=t;const redraw=()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;draw()})};function edgeV(c,r){return ((c*13+r*7)%2===0)?1:-1}function edgeH(c,r){return ((c*5+r*11)%2===0)?1:-1}
function pathFor(p,w,h){const c=p.i%cols,r=Math.floor(p.i/cols);const edges=[r===0?0:-edgeH(c,r-1),c===cols-1?0:edgeV(c,r),r===rows-1?0:edgeH(c,r),c===0?0:-edgeV(c-1,r)];const path=new Path2D();path.moveTo(0,0);const sides=[[[0,0],[w,0]],[[w,0],[w,h]],[[w,h],[0,h]],[[0,h],[0,0]]];sides.forEach(([a,b],side)=>{let dx=(b[0]-a[0]),dy=(b[1]-a[1]),len=Math.hypot(dx,dy),nx=dy/len,ny=-dx/len,sg=edges[side];const pt=(t,off=0)=>[a[0]+dx*t+nx*off,a[1]+dy*t+ny*off];const line=(t,off=0)=>{const q=pt(t,off);path.lineTo(...q)},curve=(a,b,c)=>path.bezierCurveTo(...pt(...a),...pt(...b),...pt(...c));if(!sg){line(1);return}const z=sg*Math.min(w,h)*.22;line(.29);curve([.36,0],[.38,z*.18],[.37,z*.43]);curve([.29,z*.7],[.34,z*1.15],[.5,z*1.15]);curve([.66,z*1.15],[.71,z*.7],[.63,z*.43]);curve([.62,z*.18],[.64,0],[.71,0]);line(1)});path.closePath();return path}
function size(){const rect=wrap.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);const W=rect.width,H=rect.height;if(!photo){redraw();return}const portrait=W<620;const immersiveMode=document.body.classList.contains('immersive');const maxBoardW=W-(portrait?28:Math.max(150,W*.22)),maxBoardH=H*(portrait?(immersiveMode?.61:.58):.82);const ratio=photo.width/photo.height;let bw=Math.min(maxBoardW,maxBoardH*ratio),bh=bw/ratio;board={x:portrait?(W-bw)/2:Math.max(20,(W-bw)*.34),y:portrait?Math.max(immersiveMode?56:20,(H-bh-Math.min(240,H*.25))/2):(H-bh)/2,w:bw,h:bh,cw:bw/cols,ch:bh/rows,W,H,portrait};if(pieces.length){for(const p of pieces){if(p.hidden)continue;if(p.locked){p.x=board.x+(p.i%cols)*board.cw;p.y=board.y+Math.floor(p.i/cols)*board.ch}else if(p.norm){p.x=p.norm.x*W;p.y=p.norm.y*H}p.w=board.cw;p.h=board.ch}}redraw()}
let queue=[];function refillTray(){if(!photo||!board)return;const W=board.W,H=board.H,b=board;const visible=pieces.filter(p=>p.inTray&&!p.locked);while(visible.length<3&&queue.length){const p=queue.shift();p.hidden=false;p.inTray=true;visible.push(p)}const trayTop=b.y+b.h+Math.max(22,Math.min(44,H*.035));const tray={x:12,y:trayTop,w:W-24,h:Math.max(60,Math.min(H-trayTop-16,Math.max(130,b.ch*1.65)))};const count=visible.length;const slot=tray.w/Math.max(1,count);const scale=Math.min(.92,(slot-16)/b.cw,(tray.h-20)/b.ch);visible.forEach((p,j)=>{p.scale=Math.max(.22,scale);p.x=tray.x+j*slot+(slot-b.cw*p.scale)/2;p.y=tray.y+Math.max(5,(tray.h-b.ch*p.scale)/2);p.norm={x:p.x/W,y:p.y/H}})}function reset(){if(!photo)return;[cols,rows]=dims[n];pieces=[];const W=wrap.clientWidth,H=wrap.clientHeight;for(let i=0;i<n;i++)pieces.push({i,locked:false,hidden:true,inTray:false,x:0,y:0,w:1,h:1,norm:null});size();queue=[...pieces].sort(()=>Math.random()-.5);active=null;selected=null;refillTray();active=null;selected=null;$('progress').textContent=`۰ از ${fa(n)}`;message('تکه‌ها رو کنار هم بذار 🌷');redraw()}
function drawPiece(p,alpha=1,shadow=true){const w=board.cw,h=board.ch,path=pathFor(p,w,h),x=p.x,y=p.y;ctx.save();ctx.translate(x,y);ctx.scale(p.scale||1,p.scale||1);ctx.globalAlpha=alpha;if(shadow){ctx.shadowColor='#51483c55';ctx.shadowBlur=7;ctx.shadowOffsetY=3}ctx.fillStyle='#fff';ctx.fill(path);ctx.shadowColor='transparent';ctx.save();ctx.clip(path);ctx.drawImage(photo,-(p.i%cols)*board.cw,-Math.floor(p.i/cols)*board.ch,board.w,board.h);ctx.restore();ctx.lineWidth=p.locked?1:1.8;ctx.strokeStyle=p.locked?'#fff8':(active?.p===p?'#f4a83c':'#fff');ctx.stroke(path);ctx.restore()}
function draw(){const W=wrap.clientWidth,H=wrap.clientHeight;ctx.clearRect(0,0,W,H);if(!photo)return;const b=board;ctx.save();ctx.fillStyle='#43bcb4';ctx.beginPath();ctx.roundRect(b.x-5,b.y-5,b.w+10,b.h+10,8);ctx.fill();ctx.restore();ctx.save();ctx.beginPath();ctx.rect(b.x,b.y,b.w,b.h);ctx.clip();ctx.fillStyle='#f2faf7';ctx.fillRect(b.x,b.y,b.w,b.h);if($('guide').checked){ctx.globalAlpha=.22;ctx.drawImage(photo,b.x,b.y,b.w,b.h);ctx.globalAlpha=1}ctx.restore();if($('hint').checked&&active){const p=active.p;if(!p.locked){ctx.save();ctx.translate(b.x+(p.i%cols)*b.cw,b.y+Math.floor(p.i/cols)*b.ch);const path=pathFor(p,b.cw,b.ch);ctx.fillStyle='#f3c45c99';ctx.fill(path);ctx.strokeStyle='#d69a28';ctx.lineWidth=3;ctx.stroke(path);ctx.restore()}}for(const p of pieces)if(!p.hidden&&(!active||p!==active.p))drawPiece(p,1,!p.locked);if(active)drawPiece(active.p,1,true)}
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function pick(x,y){for(let j=pieces.length-1;j>=0;j--){const p=pieces[j];if(p.locked||p.hidden)continue;const path=pathFor(p,board.cw,board.ch);if(ctx.isPointInPath(path,(x-p.x)/(p.scale||1),(y-p.y)/(p.scale||1)))return p}return null}function update(){const done=pieces.filter(p=>p.locked).length;$('progress').textContent=`${fa(done)} از ${fa(n)}`;if(done===n){message('آفرین! 🌟');setTimeout(()=>{$('win').classList.add('show');confetti()},450)}}function lock(p){p.locked=true;p.scale=1;p.x=board.x+(p.i%cols)*board.cw;p.y=board.y+Math.floor(p.i/cols)*board.ch;p.norm=null;p.inTray=false;selected=null;refillTray();message(['آفرین! ⭐','چه خوب! 🌸','درست شد! 💛'][Math.floor(Math.random()*3)]);update()}function drop(p){const tx=board.x+(p.i%cols)*board.cw,ty=board.y+Math.floor(p.i/cols)*board.ch;const snap=Math.max(18,Math.min(board.cw,board.ch)*.36);if(Math.hypot(p.x-tx,p.y-ty)<snap){lock(p)}else{p.norm={x:p.x/board.W,y:p.y/board.H};if(p.inTray){p.inTray=false;refillTray()}message('باز هم امتحان کن 🌷')}redraw()}
canvas.addEventListener('pointerdown',e=>{if(!photo)return;const pt=point(e),p=pick(pt.x,pt.y);if(!p)return;e.preventDefault();selected=p.i;pieces.splice(pieces.indexOf(p),1);pieces.push(p);const previousScale=p.scale||1;p.scale=1;p.x=pt.x-(pt.x-p.x)/previousScale;p.y=pt.y-(pt.y-p.y)/previousScale;active={p,dx:pt.x-p.x,dy:pt.y-p.y,sx:pt.x,sy:pt.y,moved:false};canvas.setPointerCapture(e.pointerId);redraw()});canvas.addEventListener('pointermove',e=>{if(!active)return;e.preventDefault();const pt=point(e),a=active;if(Math.hypot(pt.x-a.sx,pt.y-a.sy)>5)a.moved=true;if(a.moved){a.p.x=pt.x-a.dx;a.p.y=pt.y-a.dy;redraw()}});canvas.addEventListener('pointerup',e=>{if(!active)return;const a=active;active=null;if(a.moved)drop(a.p);else{message('تکه را بکش و جای آن را پیدا کن 🌟');redraw()}selected=null;redraw()});canvas.addEventListener('pointercancel',()=>{if(active){active.p.norm={x:active.p.x/board.W,y:active.p.y/board.H};active=null;redraw()}});
$('photo').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;const url=URL.createObjectURL(f),im=new Image();im.onload=()=>{const c=document.createElement('canvas');const scale=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight));c.width=Math.max(1,Math.round(im.naturalWidth*scale));c.height=Math.max(1,Math.round(im.naturalHeight*scale));const g=c.getContext('2d');g.drawImage(im,0,0,c.width,c.height);photo=c;$('empty').classList.add('hidden');URL.revokeObjectURL(url);reset()};im.onerror=()=>{URL.revokeObjectURL(url);message('این عکس باز نشد. عکس دیگری انتخاب کن.')};im.src=url;e.target.value=''});$('levels').addEventListener('click',e=>{const btn=e.target.closest('button[data-n]');if(!btn)return;n=+btn.dataset.n;document.querySelectorAll('#levels button').forEach(b=>b.classList.toggle('active',b===btn));if(photo)reset();else $('progress').textContent=`۰ از ${fa(n)}`});$('hint').addEventListener('change',redraw);$('guide').addEventListener('change',redraw);$('restart').addEventListener('click',reset);$('again').addEventListener('click',()=>{$('win').classList.remove('show');reset()});$('close').addEventListener('click',()=>$('win').classList.remove('show'));function immersive(on){document.body.classList.toggle('immersive',on);$('fullscreen').setAttribute('aria-pressed',String(on));message(on?'برای بازگشت، روی ضربدر بزن':'تکه‌ها رو کنار هم بذار 🌷');requestAnimationFrame(()=>requestAnimationFrame(size))}$('fullscreen').addEventListener('click',()=>immersive(!document.body.classList.contains('immersive')));$('exitImmersive').addEventListener('click',()=>immersive(false));function confetti(){const chars=['🌸','✨','⭐','🎉','💛'];for(let i=0;i<28;i++){const el=document.createElement('span');el.className='confetti';el.textContent=chars[i%chars.length];el.style.left=Math.random()*100+'vw';el.style.top='-30px';el.style.animationDelay=Math.random()*.6+'s';document.body.append(el);setTimeout(()=>el.remove(),3000)}}new ResizeObserver(size).observe(wrap);size();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));})();</script></body></html>
